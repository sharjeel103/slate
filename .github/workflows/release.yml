name: Build and Release Slate

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v1.1.0, etc.

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Debian Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Make build script executable
        run: chmod +x build_deb.sh

      - name: Build Debian package
        run: |
          # Extract version from tag (e.g. refs/tags/v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          ./build_deb.sh "$VERSION"

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: slate_*_amd64.deb

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon="app/app_icon.ico" --version-file="file_version_info.txt" --add-data "app/app_icon.png;app" --name "slate" main.py

      - name: Compile Inno Setup Installer
        run: |
          # GitHub Windows runners have ISCC pre-installed and available in the PATH
          iscc setup.iss

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/slate-setup.exe

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: linux-deb

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-setup

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            slate_*_amd64.deb
            slate-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
